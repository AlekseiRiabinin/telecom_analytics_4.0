services:

  postgres:
    image: postgres:15.2
    container_name: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-azure-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5    
    networks:
      - city-rover-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2GiB
        reservations:
          cpus: '0.5'
          memory: 1GiB

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - city-rover-net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512MiB

  airflow-webserver:
    build:
      context: ../../real_time_video/apps/airflow-app
      dockerfile: Dockerfile
    image: alexflames77/custom-airflow:latest
    container_name: airflow-webserver
    command: webserver
    depends_on:
      - postgres
      - clickhouse
    environment:
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - AIRFLOW_CONN_HDFS_DEFAULT=hdfs://namenode:8020
      - AIRFLOW_CONN_KAFKA_DEFAULT=kafka://kafka-1:19092
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - AIRFLOW_CONN_MINIO_DEFAULT=s3://minioadmin:minioadmin@minio:9002
      - AIRFLOW_CONN_CLICKHOUSE_DEFAULT=clickhouse://admin:clickhouse_admin@clickhouse:8123/telecom_analytics
      - AIRFLOW_CONN_MSSQL_DEFAULT=mssql+pyodbc://sa:Admin123!@mssql:1433/telecom_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./shared/ivy-cache:/home/airflow/.ivy2
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./spark/pipelines:/opt/airflow/dags/spark/pipelines
      - ./spark/jars:/opt/airflow/jars
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/airflow/city-rover-jars
    ports:
      - "8083:8080"
    networks:
      - city-rover-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2GiB

  airflow-scheduler:
    image: alexflames77/custom-airflow:latest
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      - airflow-webserver
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      - AIRFLOW_CONN_HDFS_DEFAULT=hdfs://namenode:8020
      - AIRFLOW_CONN_KAFKA_DEFAULT=kafka://kafka-1:19092
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - AIRFLOW_CONN_MINIO_DEFAULT=s3://minioadmin:minioadmin@minio:9002
      - AIRFLOW_CONN_CLICKHOUSE_DEFAULT=clickhouse://admin:clickhouse_admin@clickhouse:8123/telecom_analytics
      - AIRFLOW_CONN_MSSQL_DEFAULT=mssql+pyodbc://sa:Admin123!@mssql:1433/telecom_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./shared/ivy-cache:/home/airflow/.ivy2
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./spark/pipelines:/opt/airflow/dags/spark/pipelines
      - ./spark/jars:/opt/airflow/jars
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/airflow/city-rover-jars
    networks:
      - city-rover-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2GiB

  airflow-worker-1:
    image: alexflames77/custom-airflow:latest
    container_name: airflow-worker-1
    command: celery worker
    depends_on:
      - airflow-webserver
      - redis
      - postgres
    environment:
      - AIRFLOW_CONN_HDFS_DEFAULT=hdfs://namenode:8020
      - AIRFLOW_CONN_KAFKA_DEFAULT=kafka://kafka-1:19092
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - AIRFLOW_CONN_MINIO_DEFAULT=s3://minioadmin:minioadmin@minio:9002
      - AIRFLOW_CONN_CLICKHOUSE_DEFAULT=clickhouse://admin:clickhouse_admin@clickhouse:8123/telecom_analytics
      - AIRFLOW_CONN_MSSQL_DEFAULT=mssql+pyodbc://sa:Admin123!@mssql:1433/telecom_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./shared/ivy-cache:/home/airflow/.ivy2
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./spark/pipelines:/opt/airflow/dags/spark/pipelines
      - ./spark/jars:/opt/airflow/jars
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/airflow/city-rover-jars
    networks:
      - city-rover-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1GiB

  airflow-worker-2:
    image: alexflames77/custom-airflow:latest
    container_name: airflow-worker-2
    command: celery worker
    depends_on:
      - airflow-webserver
      - redis
      - postgres
    environment:
      - AIRFLOW_CONN_HDFS_DEFAULT=hdfs://namenode:8020
      - AIRFLOW_CONN_KAFKA_DEFAULT=kafka://kafka-1:19092
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - AIRFLOW_CONN_MINIO_DEFAULT=s3://minioadmin:minioadmin@minio:9002
      - AIRFLOW_CONN_CLICKHOUSE_DEFAULT=clickhouse://admin:clickhouse_admin@clickhouse:8123/telecom_analytics
      - AIRFLOW_CONN_MSSQL_DEFAULT=mssql+pyodbc://sa:Admin123!@mssql:1433/telecom_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./shared/ivy-cache:/home/airflow/.ivy2
      - ./hadoop-conf:/opt/hadoop/etc/hadoop
      - ./spark/pipelines:/opt/airflow/dags/spark/pipelines
      - ./spark/jars:/opt/airflow/jars
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/airflow/city-rover-jars
    networks:
      - city-rover-net
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1GiB

  airflow-init:
    image: alexflames77/custom-airflow:latest
    container_name: airflow-init
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create \
      --username admin \
      --firstname Admin \
      --lastname User \
      --role Admin \
      --email admin@example.com \
      --password admin"
    depends_on:
      - clickhouse
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://postgres:postgres@postgres:5432/postgres
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:postgres@postgres:5432/postgres
      - AIRFLOW__CORE__FERNET_KEY=PakKUDc_578hbrABpAhOs0PMn7RnDBfkgRO03e_tugA=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_CONN_HDFS_DEFAULT=hdfs://namenode:8020
      - AIRFLOW_CONN_KAFKA_DEFAULT=kafka://kafka-1:19092
      - AIRFLOW_CONN_SPARK_DEFAULT=spark://spark-master:7077
      - AIRFLOW_CONN_MINIO_DEFAULT=s3://minioadmin:minioadmin@minio:9002
      - AIRFLOW_CONN_CLICKHOUSE_DEFAULT=clickhouse://admin:clickhouse_admin@clickhouse:8123/telecom_analytics
      - AIRFLOW_CONN_MSSQL_DEFAULT=mssql+pyodbc://sa:Admin123!@mssql:1433/telecom_db?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config/airflow.cfg:/opt/airflow/airflow.cfg 
      - ./shared/ivy-cache:/home/airflow/.ivy2
    networks:
      - city-rover-net

  clickhouse:
    image: clickhouse/clickhouse-server:25.9
    container_name: clickhouse-server
    ports:
      - "8123:8123"   # HTTP API
      - "9000:9000"   # Native interface
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: clickhouse_admin
      CLICKHOUSE_DB: telecom_analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=admin", "--password=clickhouse_admin", "--host=localhost", "--query=SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  spark-master:
    image: alexflames77/custom-spark:latest
    container_name: spark-master
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8091:8080"
    environment:
      SPARK_MODE: master
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_MASTER_HOST: spark-master
      SPARK_LOCAL_IP: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_LOG_LEVEL: INFO
      PYSPARK_PYTHON: python3.10
      PYSPARK_DRIVER_PYTHON: python3.10
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-master.sh -h spark-master -p 7077 --webui-port 8080 &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.master.Master-*.out"
    volumes:
      - ./spark/jars:/opt/spark/custom-jars
      - ./spark/pipelines:/opt/spark/work-dir/pipelines
      - ./spark/jars:/opt/airflow/jars:ro
      - ./shared/ivy-cache:/home/spark/.ivy2
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/spark/city-rover-jars
    restart: always

  spark-worker:
    image: alexflames77/custom-spark:latest
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_PORT: 8881
      SPARK_LOCAL_IP: spark-worker
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_LOG_LEVEL: INFO
      PYSPARK_PYTHON: python3.10
      PYSPARK_DRIVER_PYTHON: python3.10
    command: >
      /bin/bash -c "
      /opt/spark/sbin/start-worker.sh spark://spark-master:7077 
      --webui-port 8081 
      --memory 4G 
      --cores 2 &&
      tail -f /opt/spark/logs/spark--org.apache.spark.deploy.worker.Worker-*.out"
    volumes:
      - ./spark/jars:/opt/spark/custom-jars
      - ./spark/pipelines:/opt/spark/work-dir/pipelines
      - ./spark/jars:/opt/airflow/jars:ro
      - ./shared/ivy-cache:/home/spark/.ivy2
      - ../spatio_temporal_stream_processing/batch-processing/city-rover/spark-jars:/opt/spark/city-rover-jars
    depends_on:
      - spark-master
    restart: always

volumes:
  clickhouse_data:
  clickhouse_log:
  postgres-azure-data:
  redis-data:

networks:
  city-rover-net:
    external: true
    name: city-rover-net
